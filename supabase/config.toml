# Live project (personal Supabase, migrated off the Lovable tenant 2026-04-22)
project_id = "ifonivphhfplntzshtsb"

# Auth URL configuration — required for the /account-recovery password-reset
# flow (the emailed link must be allowed to redirect there). Applied to hosted
# projects via `supabase config push [--project-ref ...]`.
# NOTE: this block documents intent only — `supabase config push` cannot be used
# (it syncs unrelated paid-tier settings and 402s), so the REAL setting lives in
# the dashboard under Authentication -> URL Configuration, per project.
#
# site_url is the fallback Supabase uses when a redirectTo does not match the
# allow-list below — it does not silently honour the requested URL, it silently
# replaces it. Pointing it at a raw *.vercel.app deployment is what broke
# password recovery: those deployments sit behind Vercel Deployment Protection,
# so the recovery link landed on a Vercel SSO "request access" page.
#
# The apex 308-redirects to www, so window.location.origin is the www host —
# both are listed because OwnerLogin builds redirectTo from the live origin.
[auth]
site_url = "https://www.eduledgerng.com"
additional_redirect_urls = [
  "https://www.eduledgerng.com/account-recovery",
  "https://www.eduledgerng.com",
  "https://eduledgerng.com/account-recovery",
  "https://eduledgerng.com",
  "https://eduledgerng.vercel.app/account-recovery",
  "http://localhost:8080/account-recovery",
  "http://localhost:8080",
]

# verify_jwt = false ONLY where the caller genuinely cannot hold a Supabase JWT:
# the student auth system (students are not Supabase users) and Paystack's
# server-to-server webhook. Every other function relies on the platform check
# PLUS its own auth.getUser() call — the anon key is itself a valid JWT, so
# verify_jwt alone proves nothing about who is calling.
#
# Each of these does its own authorization: student-* verify a password or a
# session token, create/verify-paystack-payment require a session token, and
# paystack-webhook verifies the HMAC signature on the raw body.
#
# register-school used to be here. It is not any more: it takes the owner from
# the caller's JWT, so it must have one.

[functions.student-auth]
verify_jwt = false

[functions.change-pin]
verify_jwt = false

[functions.student-set-pin]
verify_jwt = false

[functions.create-payment]
verify_jwt = false

[functions.verify-payment]
verify_jwt = false

# Paystack calls this server-to-server and holds no Supabase JWT. The
# x-paystack-signature HMAC IS the authorization.
[functions.paystack-webhook]
verify_jwt = false

# Superseded by create-payment / verify-payment. Kept deployed only until the
# frontend rollout completes, then delete from the hosted project.
[functions.create-paystack-payment]
verify_jwt = false

[functions.verify-paystack-payment]
verify_jwt = false
